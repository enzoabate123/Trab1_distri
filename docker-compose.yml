x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  CLUSTER_ID: "M2M4MjYyNTYtMjM4ZC00Y2"

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.2

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    env_file:
      - .env
    entrypoint: ["/bin/bash"]
    command:
      - "-ec"
      - |
        echo "Aguardando Kafka iniciar..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --bootstrap-server kafka-1:9092 \
          --topic "$${KAFKA_TOPIC}" \
          --partitions "$${KAFKA_NUM_PARTITIONS}" \
          --replication-factor "$${KAFKA_REPLICATION_FACTOR}"
        echo "Tópico $${KAFKA_TOPIC} pronto"

  sensor-1:
    build: ./producer
    container_name: sensor-1
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    env_file:
      - .env
    environment:
      SENSOR_ID: "sensor-1"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"

  sensor-2:
    build: ./producer
    container_name: sensor-2
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    env_file:
      - .env
    environment:
      SENSOR_ID: "sensor-2"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"

  sensor-3:
    build: ./producer
    container_name: sensor-3
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    env_file:
      - .env
    environment:
      SENSOR_ID: "sensor-3"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"

  consumer:
    build: ./consumer
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: on-failure
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
    volumes:
      - consumer-data:/data

volumes:
  consumer-data: