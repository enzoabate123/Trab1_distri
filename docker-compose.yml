version: "3.8"

x-kafka-common: &kafka-common
  image: bitnami/kafka:3.7
  environment:
    KAFKA_CFG_PROCESS_ROLES: broker,controller
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_KRAFT_CLUSTER_ID: "M2M4MjYyNTYtMjM4ZC00Y2"
    KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    environment:
      <<: *kafka-common.environment
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    environment:
      <<: *kafka-common.environment
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    environment:
      <<: *kafka-common.environment
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  # Inicializador para criar o tópico automaticamente
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    env_file:
      - .env
    command: >
      bash -c "
      echo 'Aguardando Kafka iniciar...';
      sleep 10;
      kafka-topics.sh --create --if-not-exists --bootstrap-server kafka-1:9092 --topic $${KAFKA_TOPIC} --partitions $${KAFKA_NUM_PARTITIONS} --replication-factor $${KAFKA_REPLICATION_FACTOR};
      echo 'Tópico $${KAFKA_TOPIC} criado com sucesso!'
      "
